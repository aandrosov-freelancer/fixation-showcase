name: app
description:
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.5.1
  flutter_quill_extensions: ^11.0.0
  flutter_staggered_animations: ^1.1.1
  freezed_annotation: ^3.1.0
  go_router: ^17.4.0
  go_transitions: ^0.8.3
  hooks_riverpod: ^3.4.2
  image_picker: ^1.1.2
  intl: any
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^3.1.15
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  drift_dev: ^2.34.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/

flutter_gen:
  output: lib/core/values

  colors:
    inputs:
      - assets/colors/colors.xml
